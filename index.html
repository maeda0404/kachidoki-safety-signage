<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>勝どき 安全・気象情報</title><link rel="stylesheet" href="./style.css?v=1"></head><body><main id="signage"><header><h1>勝どき 安全・気象情報</h1><div><time id="clock">--</time><span id="network">●取得中</span></div></header><div id="stale" hidden>最新情報を取得できていません</div><section class="hero"><div><h2>現在の気象状況</h2><div class="temp"><b id="temperature">--</b>℃</div><p id="weatherLabel">情報取得中</p></div><div id="statusCard"><small>総合判定</small><strong id="statusText">確認中</strong></div></section><section class="metrics"><article>降水確率<b id="rainProbability">--%</b></article><article>現在の降水量<b id="precipitation">-- mm/h</b></article><article>風速<b id="windSpeed">-- m/s</b></article><article>最低気温<b id="minTemperature">--℃</b></article><article>日没時刻<b id="sunsetTime">--:--</b></article></section><section class="info"><div><h2>発表・判定中の情報</h2><p id="activeAlerts">確認中</p></div><div><h2>表示ルール</h2><p>警報級は即時表示、注意情報は毎時00分から10分間表示</p></div></section><footer>出典：気象庁・Open-Meteoの公開情報を加工して表示 <span>データ生成：<b id="generatedAt">--</b></span><p>本表示は補助情報です。現場責任者の指示、会社の安全基準、自治体・気象庁の公式情報を優先してください。</p></footer></main><section id="alertOverlay" hidden><img id="alertImage" alt="安全注意喚起"><div><b id="overlayTitle"></b> <span id="overlayCounter"></span></div></section><script src="./config.js?v=1"></script><script src="./app.js?v=1"></script></body></html>
